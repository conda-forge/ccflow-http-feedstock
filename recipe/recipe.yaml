context:
  name: ccflow-http
  version: "0.4.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ccflow-http/ccflow_http-${{ version }}.tar.gz
  sha256: 5dd03013d444b341039fb6737c95b87fa1e7ee9523b9d0a5736eed40ef314862

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - ccflow >=0.8.5
    - ccflow-etl >=0.4.0
    - httpx2
    - jinja2

tests:
  - python:
      imports:
        - ccflow_http
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/1kbgz/ccflow-http
  repository: https://github.com/1kbgz/ccflow-http
  summary: ccflow models for HTTP
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
